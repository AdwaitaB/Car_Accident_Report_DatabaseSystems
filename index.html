<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Accident Database System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #e0e0e0;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
        .tab-content {
            padding: 30px;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f85032 0%, #e73827 100%);
        }
        
        .search-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .accident-card {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .accident-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .accident-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .accident-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .info-value {
            font-size: 14px;
            color: #333;
            margin-top: 2px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> Car Accident Database System</h1>
            <p>Track, Analyze, and Prevent Traffic Accidents</p>
        </header>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('search', this)">Search Accidents</button>
            <button class="tab" onclick="showTab('add', this)">Add Accident</button>
            <button class="tab" onclick="showTab('statistics', this)">Statistics</button>
            <button class="tab" onclick="showTab('trends', this)">Yearly Trends</button>
        </div>
        
        <div class="tab-content">
            <!-- Search Tab -->
            <div id="search" class="section active">
                <h2>National Accident Statistics</h2>
                <div class="search-filters">
                    <div class="form-group">
                        <label>Filter by Year</label>
                        <input type="number" id="filterYear" placeholder="e.g., 2023" min="1990" max="2099">
                    </div>
                </div>
                <button class="btn" onclick="searchAccidents()">Search</button>
                
                <div id="searchResults" style="margin-top: 30px;"></div>
            </div>
            
            <!-- Add Accident Tab -->
            <div id="add" class="section">
                <h2>Add National Accident Statistics</h2>
                <p><em>Enter yearly national accident statistics data</em></p>
                <form id="addAccidentForm">
                    <div class="form-group">
                        <label>Year *</label>
                        <input type="number" id="year" required min="1990" max="2099" placeholder="e.g., 2024">
                    </div>
                    <div class="form-group">
                        <label>Total Fatalities *</label>
                        <input type="number" id="total_fatalities" required min="0" placeholder="e.g., 42000">
                    </div>
                    <div class="form-group">
                        <label>Fatal Crashes *</label>
                        <input type="number" id="fatal_crashes" required min="0" placeholder="e.g., 39000">
                    </div>
                    <div class="form-group">
                        <label>Drivers Killed</label>
                        <input type="number" id="drivers_killed" min="0" placeholder="e.g., 21000">
                    </div>
                    <div class="form-group">
                        <label>Passengers Killed</label>
                        <input type="number" id="passengers_killed" min="0" placeholder="e.g., 6000">
                    </div>
                    <div class="form-group">
                        <label>Motorcyclists Killed</label>
                        <input type="number" id="motorcyclists_killed" min="0" placeholder="e.g., 6000">
                    </div>
                    <div class="form-group">
                        <label>Pedalcyclists Killed</label>
                        <input type="number" id="pedalcyclists_killed" min="0" placeholder="e.g., 1000">
                    </div>
                    <div class="form-group">
                        <label>Pedestrians Killed</label>
                        <input type="number" id="pedestrians_killed" min="0" placeholder="e.g., 7000">
                    </div>
                    <div class="form-group">
                        <label>Licensed Drivers</label>
                        <input type="number" id="licensed_drivers" min="0" placeholder="e.g., 228000000">
                    </div>
                    <div class="form-group">
                        <label>Registered Vehicles</label>
                        <input type="number" id="registered_vehicles" min="0" placeholder="e.g., 280000000">
                    </div>
                    <div class="form-group">
                        <label>Resident Population</label>
                        <input type="number" id="resident_population" min="0" placeholder="e.g., 330000000">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Miles Traveled (millions)</label>
                        <input type="number" id="vehicle_miles_traveled" step="0.01" min="0" placeholder="e.g., 3200">
                    </div>
                    <div class="form-group">
                        <label>Fatality Rate per 100k Population</label>
                        <input type="number" id="fatality_rate_per_100k_pop" step="0.01" min="0" placeholder="e.g., 12.5">
                    </div>
                    <button type="submit" class="btn">Add Statistics Record</button>
                </form>
                <div id="addResult"></div>
            </div>
            
            <!-- Statistics Tab -->
            <div id="statistics" class="section">
                <h2>Accident Statistics by Contributing Factors</h2>
                <button class="btn" onclick="loadFactorStatistics()">Load Statistics</button>
                <div id="factorStats"></div>
            </div>
            
            <!-- Trends Tab -->
            <div id="trends" class="section">
                <h2>Yearly Accident Trends</h2>
                <button class="btn" onclick="loadYearlyTrends()">Load Trends</button>
                <div id="yearlyTrends"></div>
            </div>
        </div>
    </div>
    
    <script>
        
const API_BASE = "http://127.0.0.1:5000";

// ---------------------- TAB LOGIC ----------------------
function showTab(tabName, btn) {
    document.querySelectorAll('.section').forEach(section =>
        section.classList.remove('active')
    );
    document.querySelectorAll('.tab').forEach(tab =>
        tab.classList.remove('active')
    );

    document.getElementById(tabName).classList.add('active');
    if (btn) btn.classList.add('active');
}

// ---------------------- SEARCH ACCIDENTS ----------------------
async function searchAccidents() {
    const year = document.getElementById('filterYear').value;

    const params = new URLSearchParams();
    if (year) params.append('year', year);
    const url = `${API_BASE}/accidents${params.toString() ? '?' + params.toString() : ''}`;

    const resultsDiv = document.getElementById('searchResults');
    resultsDiv.innerHTML = `<p class='loading'>Loading...</p>`;

    try {
        const res = await fetch(url);
        const data = await res.json();
        displayResults(data);
    } catch (err) {
        resultsDiv.innerHTML = `<div class="error">Error loading data.</div>`;
    }
}

// ---------------------- DISPLAY RESULTS ----------------------
function displayResults(stats) {
    const resultsDiv = document.getElementById('searchResults');

    if (!stats || !stats.length) {
        resultsDiv.innerHTML = '<p class="loading">No statistics found.</p>';
        return;
    }

    let html = '<div class="stats-grid">';
    stats.forEach(stat => {
        html += `
            <div class="accident-card">
                <h3>Year ${stat.year}</h3>
                <div class="accident-info">
                    <div class="info-item">
                        <span class="info-label">Total Fatalities</span>
                        <span class="info-value">${stat.total_fatalities || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fatal Crashes</span>
                        <span class="info-value">${stat.fatal_crashes || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Drivers Killed</span>
                        <span class="info-value">${stat.drivers_killed || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Motorcyclists Killed</span>
                        <span class="info-value">${stat.motorcyclists_killed || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Pedestrians Killed</span>
                        <span class="info-value">${stat.pedestrians_killed || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fatality Rate (per 100k pop)</span>
                        <span class="info-value">${parseFloat(stat.fatality_rate_per_100k_pop).toFixed(2) || 'N/A'}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Licensed Drivers</span>
                        <span class="info-value">${stat.licensed_drivers || 0}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Registered Vehicles</span>
                        <span class="info-value">${stat.registered_vehicles || 0}</span>
                    </div>
                </div>
            </div>
        `;
    });

    html += '</div>';
    resultsDiv.innerHTML = html;
}

// Load all statistics on startup
(async function loadInitialStats() {
    try {
        const res = await fetch(`${API_BASE}/accidents`);
        const data = await res.json();
        displayResults(data);
    } catch (err) {
        console.error('Failed to load initial statistics:', err);
    }
})();

// ---------------------- ADD STATISTIC ----------------------
document.getElementById('addAccidentForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = {
        year: parseInt(document.getElementById('year').value),
        total_fatalities: parseInt(document.getElementById('total_fatalities').value),
        fatal_crashes: parseInt(document.getElementById('fatal_crashes').value),
        drivers_killed: parseInt(document.getElementById('drivers_killed').value) || 0,
        passengers_killed: parseInt(document.getElementById('passengers_killed').value) || 0,
        motorcyclists_killed: parseInt(document.getElementById('motorcyclists_killed').value) || 0,
        pedalcyclists_killed: parseInt(document.getElementById('pedalcyclists_killed').value) || 0,
        pedestrians_killed: parseInt(document.getElementById('pedestrians_killed').value) || 0,
        nonmotorists_total: 0,
        other_nonmotorists_killed: 0,
        unknown_occupants: 0,
        vehicle_occupants_total: 0,
        licensed_drivers: parseInt(document.getElementById('licensed_drivers').value) || 0,
        registered_vehicles: parseInt(document.getElementById('registered_vehicles').value) || 0,
        resident_population: parseInt(document.getElementById('resident_population').value) || 0,
        vehicle_miles_traveled: parseFloat(document.getElementById('vehicle_miles_traveled').value) || 0,
        fatality_rate_per_100k_pop: parseFloat(document.getElementById('fatality_rate_per_100k_pop').value) || 0,
        fatality_rate_per_100k_drivers: 0,
        fatality_rate_per_100k_vehicles: 0,
        fatality_rate_per_100m_vmt: 0
    };

    const addResult = document.getElementById('addResult');
    addResult.innerHTML = "<p class='loading'>Submitting...</p>";

    try {
        const res = await fetch(`${API_BASE}/accidents/form`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const result = await res.json();

        addResult.innerHTML = `<div class="success">Statistics added! Record ID: ${result.id}</div>`;
        this.reset();
        await searchAccidents();

        setTimeout(() => (addResult.innerHTML = ""), 3000);

    } catch (err) {
        addResult.innerHTML = `<div class="error">Error adding statistics: ${err.message}</div>`;
    }
});

// ---------------------- LOAD STATISTICS ----------------------
async function loadFactorStatistics() {
    const statsDiv = document.getElementById('factorStats');
    statsDiv.innerHTML = "<p class='loading'>Loading...</p>";

    try {
        const res = await fetch(`${API_BASE}/statistics/factors`);
        const data = await res.json();
        let html = `<table style="width:100%; border-collapse: collapse;"><thead>
            <tr style="background: #667eea; color: white;"><th style="padding: 10px; border: 1px solid #ddd;">Year</th><th style="padding: 10px; border: 1px solid #ddd;">Total Fatalities</th><th style="padding: 10px; border: 1px solid #ddd;">Fatal Crashes</th><th style="padding: 10px; border: 1px solid #ddd;">Fatality Rate (per 100k)</th></tr>
        </thead><tbody>`;

        data.forEach(row => {
            html += `<tr style="border: 1px solid #ddd;"><td style="padding: 10px; border: 1px solid #ddd;">${row.year}</td><td style="padding: 10px; border: 1px solid #ddd;">${row.total_fatalities}</td><td style="padding: 10px; border: 1px solid #ddd;">${row.fatal_crashes}</td><td style="padding: 10px; border: 1px solid #ddd;">${parseFloat(row.fatality_rate_per_100k_pop).toFixed(2)}</td></tr>`;
        });

        html += "</tbody></table>";
        statsDiv.innerHTML = html;

    } catch (err) {
        statsDiv.innerHTML = `<div class="error">Could not load statistics.</div>`;
    }
}

// ---------------------- LOAD YEARLY TRENDS ----------------------
async function loadYearlyTrends() {
    const trendsDiv = document.getElementById('yearlyTrends');
    trendsDiv.innerHTML = "<p class='loading'>Loading...</p>";

    try {
        const res = await fetch(`${API_BASE}/trends/yearly`);
        const data = await res.json();
        const years = data.years || [];
        const counts = data.counts || [];

        if (!years.length) {
            trendsDiv.innerHTML = '<p class="loading">No trend data available.</p>';
            return;
        }

        let html = '<div class="stats-grid">';

        for (let i = 0; i < years.length; i++) {
            html += `
                <div class="stat-card">
                    <div class="stat-label">${years[i]}</div>
                    <div class="stat-number">${counts[i]}</div>
                    <div class="stat-label">Fatal Crashes</div>
                </div>
            `;
        }

        html += "</div>";
        trendsDiv.innerHTML = html;

    } catch (err) {
        trendsDiv.innerHTML = `<div class="error">Could not load trends.</div>`;
    }
}
</script>
